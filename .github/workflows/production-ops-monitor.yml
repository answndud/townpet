name: production-ops-monitor

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["production-db-security"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  health:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    env:
      OPS_BASE_URL: ${{ vars.OPS_BASE_URL || 'https://townpet.vercel.app' }}
      OPS_HEALTH_INTERNAL_TOKEN: ${{ secrets.HEALTH_INTERNAL_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production health
        run: pnpm ops:check:health

  alert:
    if: ${{ always() && (needs.health.result == 'failure' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')) }}
    needs: [health]
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Validate Sentry alert destination
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::error::Missing required secret: SENTRY_DSN"
            exit 1
          fi

      - name: Send operational alert to Sentry
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
          const dsn = new URL(process.env.SENTRY_DSN);
          const projectId = dsn.pathname.split("/").filter(Boolean).pop();
          if (!projectId || !dsn.username) throw new Error("Invalid SENTRY_DSN");
          const endpoint = `${dsn.origin}/api/${projectId}/store/?sentry_version=7&sentry_key=${encodeURIComponent(dsn.username)}`;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              event_id: crypto.randomUUID().replaceAll("-", ""),
              timestamp: Date.now() / 1000,
              platform: "github-actions",
              level: "error",
              message: "TownPet production operational check failed",
              tags: { source: "production-ops-monitor", event: process.env.EVENT_NAME },
              extra: { workflow: process.env.WORKFLOW_URL },
            }),
          });
          if (!response.ok) throw new Error(`Sentry returned HTTP ${response.status}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
