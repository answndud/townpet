name: production-backup

on:
  workflow_dispatch:
  schedule:
    # Every day at 02:20 UTC (KST 11:20)
    - cron: "20 2 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '35' }}
      AWS_ROLE_ARN: ${{ secrets.BACKUP_AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.BACKUP_AWS_REGION || 'ap-northeast-2' }}

    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in DATABASE_URL BACKUP_AGE_RECIPIENT BACKUP_S3_URI AWS_ROLE_ARN; do
            if [ -z "${!key:-}" ]; then
              missing+=("${key}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing backup configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          case "${BACKUP_S3_URI}" in
            s3://*) ;;
            *) echo "::error::BACKUP_S3_URI must use the s3:// scheme"; exit 1 ;;
          esac
          case "${BACKUP_AGE_RECIPIENT}" in
            age1*) ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT must be an age recipient, never a private key"; exit 1 ;;
          esac

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create encrypted PostgreSQL backup
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="${workdir}/townpet-${timestamp}.dump"
          encrypted="${dump}.age"
          pg_dump --format=custom --no-owner --file="${dump}" "${DATABASE_URL}"
          age --recipient="${BACKUP_AGE_RECIPIENT}" --output="${encrypted}" "${dump}"
          rm -f "${dump}"
          aws s3 cp "${encrypted}" "${BACKUP_S3_URI%/}/${timestamp}/townpet-${timestamp}.dump.age" \
            --storage-class STANDARD_IA \
            --metadata "encrypted=age,retention-days=${BACKUP_RETENTION_DAYS},source=github-actions"

      - name: Verify remote backup object
        shell: bash
        run: |
          set -euo pipefail
          aws s3 ls "${BACKUP_S3_URI%/}/" --recursive | tail -n 5
